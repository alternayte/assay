name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The chart version follows the release: the chart of v1.5.0 is 1.5.0
      # and installs the image v1.5.0. It goes to the release and to GHCR.
      - name: Install helm
        run: GOBIN=$PWD/bin go install helm.sh/helm/v3/cmd/helm@v3.17.3
      - name: Package and publish the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          bin/helm package deploy/helm/assay --version "${TAG#v}" --app-version "$TAG" -d tmp/chart
          gh release upload "$TAG" "tmp/chart/assay-${TAG#v}.tgz"
          echo "$GITHUB_TOKEN" | bin/helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          bin/helm push "tmp/chart/assay-${TAG#v}.tgz" oci://ghcr.io/alternayte/charts
