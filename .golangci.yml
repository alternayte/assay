version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: ^tools/
        linters: [gosec]
      # A literal keeps API types apart from generated row types.
      - linters: [staticcheck]
        text: "S1016:"
