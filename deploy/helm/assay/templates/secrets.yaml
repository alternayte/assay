{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "set database.url or database.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "assay.databaseSecret" . }}
  labels: {{- include "assay.labels" . | nindent 4 }}
type: Opaque
stringData:
  ASSAY_DATABASE_URL: {{ .Values.database.url | quote }}
---
{{- end }}
{{- if not .Values.keys.existingSecret }}
{{- $name := include "assay.keysSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "assay.labels" . | nindent 4 }}
  annotations:
    # A new key would make every stored token unreadable, so the key outlives
    # an uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  ASSAY_SECRET_KEY: {{ index $existing.data "ASSAY_SECRET_KEY" }}
  ASSAY_SETUP_TOKEN: {{ index $existing.data "ASSAY_SETUP_TOKEN" }}
  {{- else }}
  ASSAY_SECRET_KEY: {{ randAlphaNum 32 | b64enc | b64enc }}
  ASSAY_SETUP_TOKEN: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
