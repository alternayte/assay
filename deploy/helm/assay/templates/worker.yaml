apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assay.fullname" . }}-worker
  labels: {{- include "assay.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "assay.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      {{- with .Values.worker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Running jobs get 25 seconds to finish. Then they go back to the
      # queue, and another worker continues them.
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: {{ include "assay.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASSAY_ROLE
              value: worker
            {{- include "assay.env" (dict "root" . "env" .Values.worker.env) | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if .Values.worker.autoscaling.enabled }}
---
# The PostgreSQL scaler reads the queue depth: the jobs that wait on the
# sync, embed and extract queues. KEDA needs no metrics adapter for it.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "assay.fullname" . }}-worker
  labels: {{- include "assay.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: connection
      name: {{ include "assay.databaseSecret" . }}
      key: ASSAY_DATABASE_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "assay.fullname" . }}-worker
  labels: {{- include "assay.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "assay.fullname" . }}-worker
  minReplicaCount: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.worker.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.worker.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.worker.autoscaling.cooldownPeriod }}
  triggers:
    - type: postgresql
      metadata:
        query: "SELECT count(*) FROM river_job WHERE state = 'available' AND queue IN ('sync', 'embed', 'extract')"
        targetQueryValue: {{ .Values.worker.autoscaling.jobsPerReplica | quote }}
        activationTargetQueryValue: "0"
      authenticationRef:
        name: {{ include "assay.fullname" . }}-worker
{{- end }}
