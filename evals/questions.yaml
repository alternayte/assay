# The Acme evaluation set (REQ-EVL-002). Each question names parts of the
# titles or URLs of the items that a right answer cites, and words that it
# states. A no_evidence question has no answer in the Acme corpus.
#
#   assay eval --url http://localhost:8080 --token assay_... --file evals/questions.yaml

