version: "2"
sql:
  - &pkg
    engine: postgresql
    schema: [internal/auth/schema, internal/app/migrations]
    queries: internal/audit/queries.sql
    gen:
      go: &go
        package: audit
        out: internal/audit
        sql_package: pgx/v5
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_copyfrom_file_name: copyfrom.gen.go
        output_files_suffix: .gen
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type: {type: string, pointer: true}
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {type: time.Time, pointer: true}
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.numeric
            go_type: float64
  - <<: *pkg
    queries: internal/users/queries.sql
    gen:
      go:
        <<: *go
        package: users
        out: internal/users
  - <<: *pkg
    queries: internal/settings/queries.sql
    gen:
      go:
        <<: *go
        package: settings
        out: internal/settings
  - <<: *pkg
    queries: internal/secrets/queries.sql
    gen:
      go:
        <<: *go
        package: secrets
        out: internal/secrets
  - <<: *pkg
    queries: internal/models/queries.sql
    gen:
      go:
        <<: *go
        package: models
        out: internal/models
  - <<: *pkg
    queries: internal/visibility/queries.sql
    gen:
      go:
        <<: *go
        package: visibility
        out: internal/visibility
  - <<: *pkg
    queries: internal/content/queries.sql
    gen:
      go:
        <<: *go
        package: content
        out: internal/content
  - <<: *pkg
    queries: internal/sync/queries.sql
    gen:
      go:
        <<: *go
        package: sync
        out: internal/sync
  - <<: *pkg
    queries: internal/vocab/queries.sql
    gen:
      go:
        <<: *go
        package: vocab
        out: internal/vocab
  - <<: *pkg
    queries: internal/search/queries.sql
    gen:
      go:
        <<: *go
        package: search
        out: internal/search
  - <<: *pkg
    queries: internal/claims/queries.sql
    gen:
      go:
        <<: *go
        package: claims
        out: internal/claims
  - <<: *pkg
    queries: internal/ask/queries.sql
    gen:
      go:
        <<: *go
        package: ask
        out: internal/ask
  - <<: *pkg
    queries: internal/entities/queries.sql
    gen:
      go:
        <<: *go
        package: entities
        out: internal/entities
